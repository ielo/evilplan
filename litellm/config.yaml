# LiteLLM proxy: one endpoint, several models, spend tracking.
# Run:  litellm --config litellm/config.yaml   then set LITELLM_BASE_URL=http://localhost:4000
model_list:
  - model_name: haiku
    litellm_params: { model: anthropic/claude-haiku-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: sonnet
    litellm_params: { model: anthropic/claude-sonnet-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: opus
    litellm_params: { model: anthropic/claude-opus-5-5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: fable
    litellm_params: { model: anthropic/claude-fable-5-2, api_key: os.environ/ANTHROPIC_API_KEY }
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
